<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 0 928 260" width="928" height="260">
  <!-- traces (layered JSON docs) → teca-label → labeled table. Hand-kept: simple shapes only. -->
  <rect x="-48" width="928" height="260" fill="#ffffff"/>

  <!-- ── the pile: three layered documents ── -->
  <g>
    <rect x="92" y="38" width="118" height="150" rx="5" fill="#f9f9f9" stroke="#e0e0e0"/>
    <rect x="76" y="52" width="118" height="150" rx="5" fill="#fcfcfc" stroke="#d9d9d9"/>
    <rect x="60" y="66" width="118" height="150" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <!-- a hint of JSON on the front card -->
    <text x="74" y="92" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#646464">{</text>
    <rect x="86" y="102" width="58" height="6" rx="2" fill="#e8e8e8"/>
    <rect x="86" y="118" width="74" height="6" rx="2" fill="#e8e8e8"/>
    <rect x="86" y="134" width="46" height="6" rx="2" fill="#e8e8e8"/>
    <rect x="86" y="150" width="66" height="6" rx="2" fill="#e8e8e8"/>
    <text x="74" y="182" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#646464">}</text>
    <text x="119" y="240" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8d8d" text-anchor="middle">traces</text>
  </g>

  <!-- arrow -->
  <g stroke="#bbbbbb" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="238" y1="127" x2="304" y2="127"/>
    <path d="M296 120 L304 127 L296 134"/>
  </g>

  <!-- ── teca-label: the app icon with the flag ── -->
  <g>
    <rect x="336" y="89" width="76" height="76" rx="8" fill="#ffffff" stroke="#202020" stroke-width="2.5"/>
    <image x="350" y="108" width="48" height="39" href="data:image/png;base64,"/>
    <text x="374" y="240" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8d8d" text-anchor="middle">teca-label</text>
  </g>

  <!-- arrow -->
  <g stroke="#bbbbbb" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="444" y1="127" x2="510" y2="127"/>
    <path d="M502 120 L510 127 L502 134"/>
  </g>

  <!-- ── the labeled table ── -->
  <g>
    <rect x="542" y="44" width="286" height="166" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
    <!-- header band -->
    <path d="M542 49 a5 5 0 0 1 5-5 h276 a5 5 0 0 1 5 5 v27 h-286 Z" fill="#f9f9f9"/>
    <line x1="542" y1="76" x2="828" y2="76" stroke="#e0e0e0"/>
    <text x="562" y="65" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#8d8d8d">row_id</text>
    <text x="668" y="65" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#8d8d8d">category</text>
    <!-- rows: id · colored dot · label -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="12">
      <text x="562" y="98"  fill="#646464">a1f4</text>
      <circle cx="674" cy="94" r="4" fill="#12a594"/>
      <text x="684" y="98"  fill="#202020">tool_loop</text>

      <text x="562" y="130" fill="#646464">8c2e</text>
      <circle cx="674" cy="126" r="4" fill="#0090ff"/>
      <text x="684" y="130" fill="#202020">missing_context</text>

      <text x="562" y="162" fill="#646464">c907</text>
      <circle cx="674" cy="158" r="4" fill="#6e56cf"/>
      <text x="684" y="162" fill="#202020">sandbox_timeout</text>

      <text x="562" y="194" fill="#646464">e5b1</text>
      <circle cx="674" cy="190" r="4" fill="#12a594"/>
      <text x="684" y="194" fill="#202020">tool_loop</text>
    </g>
    <line x1="542" y1="108" x2="828" y2="108" stroke="#f0f0f0"/>
    <line x1="542" y1="140" x2="828" y2="140" stroke="#f0f0f0"/>
    <line x1="542" y1="172" x2="828" y2="172" stroke="#f0f0f0"/>
    <text x="685" y="240" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8d8d" text-anchor="middle">teca_labels</text>
  </g>
</svg>
